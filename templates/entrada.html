<!DOCTYPE html>
<html>
<head>
    <title>Entrada de Veículos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Registrar Entrada</h2>

    {% with mensagens = get_flashed_messages() %}
      {% if mensagens %}
        <div style="text-align: center; margin-bottom: 20px;">
            {% for msg in mensagens %}
                <p style="color: green; font-weight: bold;">{{ msg }}</p>
            {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="form-container">
        <form method="POST">
            <label>Nome do Responsável:</label><br>
            <input type="text" name="responsavel" required><br>
            <label>Placa do Veículo:</label><br>
            <input type="text" name="placa" required><br>
            <button type="submit">Registrar</button>
        </form>

        <!-- Botão "Saída" após o formulário -->
        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('saida') }}">
                <button type="button">Ir para Saída</button>
            </a>
        </div>
    </div>
</body>
</html>

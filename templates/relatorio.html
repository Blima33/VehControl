<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Veículos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Relatório de Entradas e Saídas</h2>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Responsável</th>
                <th>Placa</th>
                <th>Data Entrada</th>
                <th>Data Saída</th>
            </tr>
        </thead>
        <tbody>
            {% for r in registros %}
            <tr>
                <td>{{ r[0] }}</td>
                <td>{{ r[1] }}</td>
                <td>{{ r[2] }}</td>
                <td>{{ r[3] if r[3] else '---' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <div>
        <a href="{{ url_for('relatorio') }}">Atualizar Relatório</a>
    </div>
</body>
</html>
